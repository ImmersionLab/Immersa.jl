# Stationary cylinder, Re = 40, PRIMITIVE-VARIABLE (IBPM) formulation of
# Taira & Colonius (2007), Case A: stretched grid with a uniform core around the body.
# Reference (Table 2): l/d = 2.30, C_D = 1.54.

[case]
name = "cylinder_PV"

[flow]
Re         = 40.0
freestream = [1.0, 0.0]

[grid]
type   = "stretched"
h      = 0.04                            # Δx_min in the uniform core
core   = [[-1.5, 1.5], [-1.5, 1.5]]      # uniform region (must contain the body)
growth = 1.13                            # geometric cell-growth ratio
extent = [[-30.0, 30.0], [-30.0, 30.0]]  # far field

[[body]]
name    = "cylinder"
shape   = "cylinder"
radius  = 0.5
spacing = 1.0                            # Δs ≈ Δx (Taira & Colonius §3.3)

[solver]
formulation = "IBPM"
dt          = 0.005
t_final     = 30.0

[output]
snapshot_every = 20
fields         = ["omega", "u", "p"]
