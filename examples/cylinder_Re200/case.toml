# =====================================================================
#  Immersa case file — flow past a circular cylinder, Re = 200
#
#  Run:    bin/immersa examples/cylinder_Re200/case.toml
#     or:  julia> using Immersa; run_case("examples/cylinder_Re200/case.toml")
#
#  Units are non-dimensional; ALL ANGLES ARE IN DEGREES.
#  Relative paths are relative to this file's folder.
# =====================================================================

[case]
name    = "cylinder_Re200"
backend = "CPU"                     # CPU | CUDA | AMDGPU

[flow]
Re         = 200.0
freestream = [1.0, 0.0]             # number of entries sets the dimension (2D/3D)
# ramp_time = 0.1                   # smooth start of the freestream over this time
# file      = "inflow.jl"           # user-defined freestream(t)

[grid]
type   = "uniform"                  # uniform | stretched (stretched needs IBPM)
h      = 0.02                       # finest cell size
limits = [[-1.0, 3.0], [-2.0, 2.0]] # finest-level domain, one [min, max] per axis
levels = 5                          # multi-domain levels (each doubles the extent)

[[body]]                            # repeat [[body]] for several bodies
name    = "cylinder"
shape   = "cylinder"                # cylinder | plate | naca4 | points_file
radius  = 0.5
center  = [0.0, 0.0]
spacing = 2.0                       # marker spacing ds / h
# No [body.motion] section → static body

[solver]
formulation = "FastIBPM"            # FastIBPM | IBPM
dt          = 0.002
t_final     = 100.0                 # shedding onset + periodic regime to average over
                                    # (reference, e.g. Liu et al. 1998: mean C_D ≈ 1.31,
                                    #  C_L amplitude ≈ 0.69, St ≈ 0.19)
delta       = "Yang3S2"             # Yang3S | Yang3S2

[initial_condition]                 # small vorticity blob to trigger shedding
type      = "vortex_blob"
center    = [-0.75, 0.0]
radius    = 0.25
amplitude = 0.5

[reference]                         # C = F / (½ U² L)
velocity = 1.0
length   = 1.0                      # cylinder diameter

[output]
directory      = "output"
history_every  = 1                  # forces → history.csv and solution.h5
snapshot_every = 500                # fields → solution.h5 (0 = never); 100 snapshots ≈ 0.5 GB
fields         = ["omega", "u"]     # + "p" with IBPM
log_every      = 1000
restart_every  = 0                  # checkpoint every N steps (0 = off)
